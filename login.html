<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ — CPF ธารเกษม</title>
  <meta name="description" content="เข้าสู่ระบบแดชบอร์ดค่าใช้จ่าย OE และสวัสดิการ โรงงานผลิตอาหารสัตว์ธารเกษม (CPF)" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#2E7D32" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', system-ui, sans-serif;
      background: linear-gradient(160deg, #1B5E20 0%, #2E7D32 45%, #43A047 100%);
      color: #16221C; min-height: 100vh; -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    }
    .card {
      width: 100%; max-width: 420px; background: #fff; border-radius: 20px;
      padding: 34px 30px 28px; box-shadow: 0 18px 50px rgba(0, 0, 0, .25);
    }
    .logo {
      width: 62px; height: 62px; border-radius: 16px; margin: 0 auto 16px;
      background: linear-gradient(135deg, #2E7D32, #66BB6A);
      color: #fff; font-weight: 800; font-size: 21px; letter-spacing: .5px;
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 21px; font-weight: 800; color: #1B5E20; text-align: center; line-height: 1.3; }
    .sub { font-size: 13px; color: #60706A; text-align: center; margin-top: 6px; line-height: 1.5; }
    form { margin-top: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #2F3E37; margin-bottom: 7px; }
    .field { position: relative; }
    input[type="password"], input[type="text"] {
      width: 100%; font-family: inherit; font-size: 15px; color: #16221C;
      padding: 12px 46px 12px 14px; border: 1.5px solid #D6E0DA; border-radius: 11px;
      background: #FAFCFA; transition: border-color .15s, box-shadow .15s;
    }
    input:focus { outline: none; border-color: #2E7D32; box-shadow: 0 0 0 3px rgba(46, 125, 50, .15); }
    input:focus-visible { outline: none; }
    .toggle {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      border: 0; background: none; cursor: pointer; padding: 7px 9px; border-radius: 8px;
      font-family: inherit; font-size: 12px; font-weight: 600; color: #2E7D32;
    }
    .toggle:hover { background: #E8F5E9; }
    .toggle:focus-visible { outline: 2px solid #2E7D32; outline-offset: 1px; }
    button[type="submit"] {
      width: 100%; margin-top: 16px; padding: 13px 16px; border: 0; border-radius: 11px;
      background: #2E7D32; color: #fff; font-family: inherit; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: background .15s, transform .1s;
    }
    button[type="submit"]:hover:not(:disabled) { background: #1B5E20; }
    button[type="submit"]:active:not(:disabled) { transform: translateY(1px); }
    button[type="submit"]:disabled { background: #9BB7A2; cursor: progress; }
    button[type="submit"]:focus-visible { outline: 2px solid #1B5E20; outline-offset: 2px; }
    .msg {
      margin-top: 14px; padding: 10px 12px; border-radius: 10px; font-size: 13px;
      line-height: 1.5; display: none;
    }
    .msg.err { display: block; background: #FDECEA; color: #B3261E; border: 1px solid #F5C6C2; }
    .note {
      margin-top: 22px; padding-top: 16px; border-top: 1px solid #EDF1EE;
      font-size: 11.5px; color: #7A8A83; line-height: 1.6; text-align: center;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">CPF</div>
    <h1>แดชบอร์ดค่าใช้จ่าย &amp; สวัสดิการ</h1>
    <p class="sub">โรงงานผลิตอาหารสัตว์ธารเกษม<br />สำหรับผู้ที่เกี่ยวข้องเท่านั้น</p>

    <form id="login-form" autocomplete="off">
      <label for="pass">รหัสผ่าน</label>
      <div class="field">
        <input type="password" id="pass" name="pass" autocomplete="current-password"
               autofocus required aria-describedby="msg" />
        <button type="button" class="toggle" id="btn-toggle" aria-label="แสดงรหัสผ่าน">แสดง</button>
      </div>
      <button type="submit" id="btn-login">เข้าสู่ระบบ</button>
      <p class="msg" id="msg" role="alert" aria-live="assertive"></p>
    </form>

    <p class="note">ข้อมูลในระบบเป็นข้อมูลภายใน โปรดไม่เผยแพร่รหัสผ่าน<br />เข้าระบบแล้วจะจำไว้ 8 ชั่วโมง</p>
  </main>

  <script src="assets/auth.js"></script>
  <script>
  (function () {
    'use strict';
    var form = document.getElementById('login-form');
    var input = document.getElementById('pass');
    var btn = document.getElementById('btn-login');
    var msg = document.getElementById('msg');
    var toggle = document.getElementById('btn-toggle');

    /* ปลายทางหลังล็อกอิน — รับเฉพาะหน้าในเว็บเดียวกัน
       เช็คเองทีละตัวอักษรไม่พอ: เบราว์เซอร์ normalize `\` เป็น `/` และตัด tab/newline ทิ้ง
       ทำให้ `/\evil.com` กับ `/<tab>/evil.com` กลายเป็น `//evil.com` = หลุดออกนอกเว็บ
       จึงให้ URL parser แปลงให้ก่อน แล้วดูว่า origin ตรงกับเว็บเราไหม */
    function safeNext() {
      var raw = new URLSearchParams(location.search).get('next') || '';
      if (!raw) return './';
      try {
        var u = new URL(raw, location.href);
        if (u.origin !== location.origin) return './';
        return u.pathname + u.search + u.hash;
      } catch (e) { return './'; }
    }

    /* ล็อกอินค้างอยู่แล้ว (เช่น กดย้อนกลับมา) → ไปต่อเลย */
    if (Auth.isLoggedIn()) location.replace(safeNext());

    toggle.addEventListener('click', function () {
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      toggle.textContent = show ? 'ซ่อน' : 'แสดง';
      toggle.setAttribute('aria-label', show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน');
      input.focus();
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      msg.className = 'msg';
      btn.disabled = true;
      btn.textContent = 'กำลังตรวจสอบ…';
      /* ปล่อยให้เบราว์เซอร์วาดสถานะปุ่มก่อน แล้วค่อยคำนวณ hash (กินเวลาหลักร้อย ms) */
      setTimeout(function () {
        var res = 'bad-pass';
        try { res = Auth.login(input.value); } catch (err) { res = 'bad-pass'; }
        if (res === 'ok') { location.replace(safeNext()); return; }
        btn.disabled = false;
        btn.textContent = 'เข้าสู่ระบบ';
        msg.className = 'msg err';
        /* รหัสถูกแต่เก็บ session ไม่ได้ (โหมดส่วนตัว/ปิดการเก็บข้อมูลเว็บไซต์) — ถ้าปล่อยให้เด้ง
           ต่อไปจะโดน guard เตะกลับมาวนไม่รู้จบโดยผู้ใช้ไม่รู้ว่าเกิดอะไรขึ้น */
        msg.textContent = res === 'no-storage'
          ? 'รหัสผ่านถูกต้อง แต่เบราว์เซอร์นี้ปิดการเก็บข้อมูลเว็บไซต์ไว้ — ปิดโหมดส่วนตัวหรืออนุญาตคุกกี้/ข้อมูลเว็บไซต์ แล้วลองใหม่'
          : 'รหัสผ่านไม่ถูกต้อง — ลองใหม่อีกครั้ง';
        input.select();
        input.focus();
      }, 30);
    });
  })();
  </script>
</body>
</html>
